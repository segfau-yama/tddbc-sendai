[package]
name = "rust_molkky"
version = "0.1.0"
edition = "2024"

[features]
gui_2d = ["dep:dioxus"]

[dependencies]
rand = "0.10.3"
ratatui = "0.30.2"
uuid = { version = "1.29.0", default-features = false, features = ["v4"] }
itertools = "0.15.0"
dioxus = { version = "0.7.10", optional = true, default-features = false, features = ["minimal"] }

[dev-dependencies]
dioxus-ssr = "0.7.10"
