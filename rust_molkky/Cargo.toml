[package]
name = "rust_molkky"
version = "0.1.0"
edition = "2024"
default-run = "rust_molkky"

[[bin]]
name = "rust_molkky"
path = "src/main.rs"
required-features = ["cui"]

[[bin]]
name = "gui_2d"
path = "src/bin/gui_2d.rs"
required-features = ["gui_2d"]

[[test]]
name = "application"
path = "tests/application.rs"
required-features = ["cui"]

[features]
default = ["cui"]
cui = ["dep:rand", "dep:ratatui"]
gui_2d = ["dep:dioxus", "dep:rapier2d"]
gui_2d_web = ["gui_2d", "dioxus/web", "uuid/js", "dep:web-sys"]
gui_2d_desktop = ["gui_2d", "dioxus/desktop"]

[dependencies]
rand = { version = "0.10.3", optional = true }
ratatui = { version = "0.30.2", optional = true }
uuid = { version = "1.29.0", default-features = false, features = ["v4"] }
itertools = "0.15.0"
dioxus = { version = "0.7.10", optional = true, default-features = false, features = ["minimal", "document", "mounted"] }
rapier2d = { version = "0.36.1", optional = true }
web-sys = { version = "0.3", optional = true, features = ["Location"] }
